<!-- LOCK SCREEN -->
<div id="lock" aria-label="Lock screen">
  <img class="wall" id="lockWall" alt="">
  <div class="lock-top">
    <div class="lock-date" id="lockDate"></div>
    <div class="lock-time" id="lockTime"></div>
  </div>
  <div class="lock-music" id="lockMusic" aria-label="What Dave is listening to"></div>
  <div class="lock-notes" id="lockNotes" aria-label="Notifications"></div>
  <button class="lock-hint" id="unlockBtn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    <span>Swipe up to unlock</span>
  </button>
  <div class="lock-bar" aria-hidden="true"></div>
</div>

<!-- DESKTOP / HOME -->
<div id="shell" aria-hidden="true">

  <!-- Mac -->
  <div id="mac">
    <img class="wall" id="macWall" alt="">
    <div class="menubar">
      <button class="mb-name" id="mbName" type="button" aria-haspopup="true"></button>
      <span class="mb-app" id="mbApp">Finder</span>
      <span>File</span><span>Edit</span><span>View</span><span>Window</span>
      <div class="mb-right">
        <svg width="17" height="13" viewBox="0 0 17 13" aria-hidden="true"><path d="M8.5 11.6l1.9-2a2.7 2.7 0 0 0-3.8 0zM4.6 7.5l1.3 1.3a3.7 3.7 0 0 1 5.2 0l1.3-1.3a5.5 5.5 0 0 0-7.8 0zM1.8 4.7l1.3 1.3a7.6 7.6 0 0 1 10.8 0l1.3-1.3a9.4 9.4 0 0 0-13.4 0z" fill="currentColor"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" aria-hidden="true"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill="currentColor"/><rect x="24" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
        <button type="button" class="mb-search" id="mbSearch" aria-label="Search the site (Command K)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
        <span id="mbClock"></span>
      </div>
    </div>
    <div class="mb-menu" id="mbMenu" hidden>
      <button type="button" data-menu="about">About Dave Korr</button>
      <hr>
      <button type="button" data-menu="lock">Lock Screen</button>
    </div>
    <div id="winLayer"></div>
    <div class="dock-wrap"><nav class="dock" id="dock" aria-label="Dock"></nav></div>
  </div>

  <!-- iPhone -->
  <div id="phone">
    <img class="wall" id="phoneWall" alt="">
    <div class="status" id="status">
      <span id="stClock"></span>
      <span class="st-r" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 13"><path d="M8.5 11.6l1.9-2a2.7 2.7 0 0 0-3.8 0zM4.6 7.5l1.3 1.3a3.7 3.7 0 0 1 5.2 0l1.3-1.3a5.5 5.5 0 0 0-7.8 0zM1.8 4.7l1.3 1.3a7.6 7.6 0 0 1 10.8 0l1.3-1.3a9.4 9.4 0 0 0-13.4 0z" fill="currentColor"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".45"/></svg>
      </span>
    </div>
    <div class="home" id="home"></div>
    <div id="appLayer"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>
